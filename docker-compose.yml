version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: stripe_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: bash -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn stripe_shop.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=stripe_shop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=changeme
      - DEBUG=True
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY_EUR=${STRIPE_SECRET_KEY_EUR}
      - STRIPE_PUBLISHABLE_KEY_EUR=${STRIPE_PUBLISHABLE_KEY_EUR}
      - SUCCESS_URL=http://localhost:8000/success/
      - CANCEL_URL=http://localhost:8000/cancel/
    depends_on:
      - db
    volumes:
      - .:/app
volumes:
  pgdata:
